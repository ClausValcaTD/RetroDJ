name: Genesis Build & Host Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'targets/genesis/**'
      - 'backends/**'
      - 'core/**'
      - 'drivers/ym2612/**'
      - 'tests/**'
      - '.github/workflows/build-genesis.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'targets/genesis/**'
      - 'backends/**'
      - 'core/**'
      - 'drivers/ym2612/**'
      - 'tests/**'
      - '.github/workflows/build-genesis.yml'
  workflow_dispatch:

jobs:

  build-genesis:
    name: Genesis ROM (SGDK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SGDK Sources
        run: |
          mkdir -p targets/genesis/src/core targets/genesis/src/drivers targets/genesis/src/backends
          cp -r core/* targets/genesis/src/core/
          cp -r drivers/ym2612/* targets/genesis/src/drivers/
          cp backends/backend_genesis_hw.c targets/genesis/src/backends/

      - name: Pull SGDK Docker
        run: docker pull ghcr.io/stephane-d/sgdk:latest

      - name: Build Genesis ROM
        run: |
          docker run --rm \
            -v "$PWD/targets/genesis":/src \
            -u $(id -u):$(id -g) \
            ghcr.io/stephane-d/sgdk:latest

      - name: Prepare .md ROM Output
        run: |
          # SGDK generates out/rom.bin by default; copy it to rom.md
          if [ -f targets/genesis/out/rom.bin ]; then
            cp targets/genesis/out/rom.bin targets/genesis/out/rom.md
            echo "Successfully generated rom.md from rom.bin!"
          else
            echo "Error: targets/genesis/out/rom.bin not found!"
            ls -la targets/genesis/out/
            false
          fi

      - name: Upload Genesis ROM
        uses: actions/upload-artifact@v4
        with:
          name: RDJ-genesis-rom
          path: |
            targets/genesis/out/rom.md
            targets/genesis/out/rom.bin

  build-pc-tests:
    name: PC Driver Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Run Tests
        run: |
          gcc -std=c99 -Wall -Wextra -Werror \
            tests/test_main.c \
            drivers/ym2612/ym2612_rdj.c \
            drivers/nes_2a03/2a03_rdj.c \
            backends/backend_null.c \
            backends/backend_vgm.c \
            backends/backend_serial.c \
            backends/backend_genesis_hw.c \
            targets/genesis/src/ui.c \
            targets/genesis/src/input_mapper.c \
            -I. -Icore/ -o test_runner
          ./test_runner

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_runner
